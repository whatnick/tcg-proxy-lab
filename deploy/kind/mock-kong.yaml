apiVersion: v1
kind: ConfigMap
metadata:
  name: mock-kong
  namespace: librefang
data:
  server.py: |
    import json
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            self.send_response(200)
            self.end_headers()

        def do_POST(self):
            length = int(self.headers.get("Content-Length", "0"))
            request = json.loads(self.rfile.read(length))
            action_id = (
                request["tools"][0]["function"]["parameters"]
                ["properties"]["action_id"]["enum"][0]
            )
            response = {
                "model": "kind-mock-model",
                "choices": [{
                    "message": {
                        "tool_calls": [{
                            "function": {
                                "name": "choose_legal_action",
                                "arguments": json.dumps({
                                    "action_id": action_id,
                                    "rationale": "Selected by the kind test gateway."
                                })
                            }
                        }]
                    }
                }]
            }
            body = json.dumps(response).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, format, *args):
            pass

    HTTPServer(("0.0.0.0", 8000), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong-ai-gateway
  namespace: librefang
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong-ai-gateway
  template:
    metadata:
      labels:
        app: kong-ai-gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mock-kong
          image: python:3.12-alpine
          command:
            - python
            - -B
            - /app/server.py
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: mock-kong
---
apiVersion: v1
kind: Service
metadata:
  name: kong-ai-gateway
  namespace: librefang
spec:
  selector:
    app: kong-ai-gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
