apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tcg-proxy-lab
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tcg-proxy-lab
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tcg-proxy-lab
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: librefang
      ports:
        - protocol: TCP
          port: 8000
    - ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
