apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcg-proxy-lab
  labels:
    app.kubernetes.io/name: tcg-proxy-lab
    app.kubernetes.io/part-of: tcg-proxy-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tcg-proxy-lab
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tcg-proxy-lab
        app.kubernetes.io/part-of: tcg-proxy-lab
    spec:
      serviceAccountName: tcg-proxy-lab
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/whatnick/tcg-proxy-lab:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: tcg-proxy-lab
          env:
            - name: PLAYTEST_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: tcg-proxy-lab-agent
                  key: api-key
                  optional: true
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
